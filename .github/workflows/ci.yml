name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ["22"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test
        env:
          # Provide a dummy key so env validation passes in CI
          SARVAM_API_KEY: ci-dummy-key-not-real

      - name: Build
        run: npm run build
        env:
          SARVAM_API_KEY: ci-dummy-key-not-real
          # Disable telemetry in CI
          NEXT_TELEMETRY_DISABLED: 1
